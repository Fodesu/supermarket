name: Check Registry updates

on:
  schedule:
    # Change this cron to adjust how often upstream sources are checked.
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      registry:
        description: Optional Registry ID to check
        required: false
        type: string

concurrency:
  group: registry-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.updates.outputs.changed }}
      matrix: ${{ steps.updates.outputs.matrix }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - id: updates
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          if [[ -n "$REGISTRY" ]]; then
            bun run registry:updates -- --check-registry "$REGISTRY"
          else
            bun run registry:updates
          fi

  propose:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    permissions:
      actions: write
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build approved and candidate releases
        env:
          REGISTRY: ${{ matrix.registry }}
          CANDIDATE_REVISION: ${{ matrix.candidate_revision }}
          FULL_REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        run: |
          bun run registry:updates -- \
            --registry "$REGISTRY" \
            --candidate "$CANDIDATE_REVISION" \
            --report "$RUNNER_TEMP/registry-update.md" \
            --full-report "$RUNNER_TEMP/registry-update-full.md" \
            --full-report-url "$FULL_REPORT_URL" \
            --plugin-comment-dir "$RUNNER_TEMP/registry-plugin-review"
      - name: Upload full review report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-update-${{ matrix.registry }}-${{ matrix.candidate_revision }}
          path: ${{ runner.temp }}/registry-update-full.md
          if-no-files-found: error
          retention-days: 90
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY: ${{ matrix.registry }}
          CANDIDATE_REVISION: ${{ matrix.candidate_revision }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "registries/$REGISTRY/registry.yaml" \
            "registries/$REGISTRY/release.lock.json" \
            registries/memoh/plugins/*/release.lock.json
          if ! git diff --quiet; then
            echo "Registry update generated unexpected unstaged changes" >&2
            git status --short
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Registry update produced no candidate changes" >&2
            exit 1
          fi
          base_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git write-tree)"
          branch="automation/registry-update/$REGISTRY/$CANDIDATE_REVISION-${base_sha:0:12}-${candidate_tree:0:12}"
          title="chore(registry): review $REGISTRY ${CANDIDATE_REVISION:0:12}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            remote_commit="$(git rev-parse "refs/remotes/origin/$branch")"
            remote_tree="$(git show -s --format=%T "$remote_commit")"
            remote_parents="$(git show -s --format=%P "$remote_commit")"
            if [[ "$remote_tree" != "$candidate_tree" || "$remote_parents" != "$base_sha" ]]; then
              echo "Immutable candidate branch does not match its base and complete tree: $branch" >&2
              exit 1
            fi
            echo "head_sha=$remote_commit" >> "$GITHUB_OUTPUT"
            existing_number="$(gh pr list --head "$branch" --state all --json number --jq '.[0].number // empty')"
            existing_state="$(gh pr list --head "$branch" --state all --json state --jq '.[0].state // empty')"
            case "$existing_state" in
              "")
                gh pr create \
                  --base main \
                  --head "$branch" \
                  --title "$title" \
                  --body-file "$RUNNER_TEMP/registry-update.md"
                pr_number="$(gh pr view "$branch" --json number --jq .number)"
                echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
                echo "review_comments=true" >> "$GITHUB_OUTPUT"
                echo "verify=true" >> "$GITHUB_OUTPUT"
                ;;
              OPEN)
                successful_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$remote_commit/check-runs" \
                  --jq '[.check_runs[] | select(.name == "verify" and .conclusion == "success")] | length')"
                if [[ "$successful_checks" == "0" ]]; then
                  echo "verify=true" >> "$GITHUB_OUTPUT"
                else
                  echo "verify=false" >> "$GITHUB_OUTPUT"
                fi
                echo "pr_number=$existing_number" >> "$GITHUB_OUTPUT"
                echo "review_comments=true" >> "$GITHUB_OUTPUT"
                echo "$REGISTRY candidate is already open as PR #$existing_number; left its commit and review unchanged."
                ;;
              CLOSED)
                echo "review_comments=false" >> "$GITHUB_OUTPUT"
                echo "verify=false" >> "$GITHUB_OUTPUT"
                echo "$REGISTRY candidate was rejected in PR #$existing_number; reopen it explicitly to reconsider."
                ;;
              MERGED)
                echo "review_comments=false" >> "$GITHUB_OUTPUT"
                echo "verify=false" >> "$GITHUB_OUTPUT"
                echo "$REGISTRY candidate was already merged in PR #$existing_number."
                ;;
            esac
            exit 0
          fi

          git switch -c "$branch"
          git commit -m "chore(registry): propose $REGISTRY revision"
          git push origin "$branch"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "verify=true" >> "$GITHUB_OUTPUT"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body-file "$RUNNER_TEMP/registry-update.md"
          pr_number="$(gh pr view "$branch" --json number --jq .number)"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "review_comments=true" >> "$GITHUB_OUTPUT"
      - name: Publish persistent Plugin review comments
        if: steps.candidate.outputs.review_comments == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/registry-plugin-review/*.md)
          if (( ${#reports[@]} == 0 )); then
            exit 0
          fi
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body')"
          for report in "${reports[@]}"; do
            marker="$(head -n 1 "$report")"
            if [[ "$existing" != *"$marker"* ]]; then
              gh pr comment "$PR_NUMBER" --body-file "$report"
              existing+=$'\n'"$marker"
            fi
          done
      - name: Verify immutable candidate
        if: steps.candidate.outputs.verify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"
