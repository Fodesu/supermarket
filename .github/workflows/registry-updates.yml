name: Check Registry updates

on:
  schedule:
    # Change this cron to adjust how often upstream sources are checked.
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      registry:
        description: Optional Registry ID to check
        required: false
        type: string

concurrency:
  group: registry-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.updates.outputs.changed }}
      matrix: ${{ steps.updates.outputs.matrix }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - id: updates
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          if [[ -n "$REGISTRY" ]]; then
            bun run registry:updates -- --check-registry "$REGISTRY"
          else
            bun run registry:updates
          fi

  propose:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build approved and candidate releases
        env:
          REGISTRY: ${{ matrix.registry }}
          CANDIDATE_REVISION: ${{ matrix.candidate_revision }}
        run: |
          bun run registry:updates -- \
            --registry "$REGISTRY" \
            --candidate "$CANDIDATE_REVISION" \
            --report "$RUNNER_TEMP/registry-update.md"
      - env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY: ${{ matrix.registry }}
          CANDIDATE_REVISION: ${{ matrix.candidate_revision }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "registries/$REGISTRY/registry.yaml" \
            "registries/$REGISTRY/release.lock.json" \
            registries/memoh/plugins/*/release.lock.json
          candidate_hash="$(git diff --cached --binary | git hash-object --stdin)"
          branch="automation/registry-update/$REGISTRY/$CANDIDATE_REVISION-${candidate_hash:0:12}"
          title="chore(registry): review $REGISTRY ${CANDIDATE_REVISION:0:12}"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            git diff --quiet "refs/remotes/origin/$branch" -- \
              "registries/$REGISTRY/registry.yaml" \
              "registries/$REGISTRY/release.lock.json" \
              "registries/memoh/plugins" || {
                echo "Immutable candidate branch content does not match its identity: $branch" >&2
                exit 1
              }
            existing_state="$(gh pr list --head "$branch" --state all --json state --jq '.[0].state // empty')"
            if [[ -z "$existing_state" ]]; then
              gh pr create \
                --base main \
                --head "$branch" \
                --title "$title" \
                --body-file "$RUNNER_TEMP/registry-update.md"
            else
              echo "$REGISTRY candidate already has a $existing_state PR; left its branch and review unchanged."
            fi
            exit 0
          fi

          git switch -c "$branch"
          git commit -m "chore(registry): propose $REGISTRY revision"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body-file "$RUNNER_TEMP/registry-update.md"
